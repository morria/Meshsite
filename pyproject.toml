[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshsites"
version = "0.1.0"
description = "Serve tiny Meshdown sites over Meshtastic radios (Meshsites protocol v1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["meshtastic>=2.3"]
keywords = ["meshtastic", "lora", "meshsites", "meshdown"]

[project.scripts]
meshsites = "meshsites.cli:main"

[project.urls]
Homepage = "https://github.com/morria/Meshsite"

[tool.setuptools]
packages = ["meshsites"]
